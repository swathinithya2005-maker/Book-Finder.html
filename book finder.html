<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        h1 {
            color: #2c3e6b;
        }

        input {
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            background: #2c3e6b;
            color: white;
            border: none;
            cursor: pointer;
        }

        .book {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .book img {
            width: 100px;
            float: left;
            margin-right: 20px;
        }

        .book h2 {
            color: #2c3e6b;
        }

        #loading {
            color: orange;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>📚 Book Finder</h1>

    <input
        type="text"
        id="bookInput"
        placeholder="Enter book name"
    >

    <button onclick="searchBooks()">
        Search
    </button>

    <p id="loading"></p>

    <div id="bookList"></div>


    <script>

        async function searchBooks() {

            const book =
                document.getElementById("bookInput").value;

            const loading =
                document.getElementById("loading");

            const bookList =
                document.getElementById("bookList");


            if (book === "") {

                bookList.innerHTML =
                    `<p class="error">
                        Please enter a book name
                    </p>`;

                return;
            }


            loading.innerHTML = "Loading...";

            bookList.innerHTML = "";


            try {

                const response = await fetch(
                    `https://www.googleapis.com/books/v1/volumes?q=${book}`
                );


                const data = await response.json();


                loading.innerHTML = "";


                if (!data.items) {

                    bookList.innerHTML =
                        `<p class="error">
                            Book not found
                        </p>`;

                    return;
                }


                data.items.forEach(book => {

                    const info =
                        book.volumeInfo;


                    const title =
                        info.title || "No Title";


                    const author =
                        info.authors
                            ? info.authors.join(", ")
                            : "Unknown Author";


                    const date =
                        info.publishedDate || "Unknown";


                    const image =
                        info.imageLinks
                            ? info.imageLinks.thumbnail
                            : "";


                    bookList.innerHTML += `

                        <div class="book">

                            <img src="${image}">

                            <h2>${title}</h2>

                            <p>
                                <b>Author:</b>
                                ${author}
                            </p>

                            <p>
                                <b>Published:</b>
                                ${date}
                            </p>

                            <p>
                                ${info.description
                                    ? info.description.substring(0, 150)
                                    : "No description available"}
                            </p>

                        </div>

                    `;

                });


            } catch (error) {

                loading.innerHTML = "";

                bookList.innerHTML =
                    `<p class="error">
                        Something went wrong
                    </p>`;

                console.log(error);

            }

        }

    </script>

</body>

</html>
